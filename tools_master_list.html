
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{font-family:var(--font-sans);padding:16px 0;display:flex;flex-direction:column;gap:14px;}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;}
.fb{padding:6px 14px;border-radius:100px;font-size:12px;font-weight:500;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);cursor:pointer;transition:all 0.15s;}
.fb.on{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info);}
.table-wrap{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{font-size:10px;font-weight:600;color:var(--color-text-secondary);letter-spacing:0.8px;text-transform:uppercase;padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);text-align:left;}
td{font-size:12px;color:var(--color-text-secondary);padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--color-background-secondary);}
td.name{color:var(--color-text-primary);font-weight:500;font-size:13px;}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:100px;margin-top:3px;}
.t-high{background:var(--color-background-success);color:var(--color-text-success);}
.t-med{background:var(--color-background-warning);color:var(--color-text-warning);}
.t-low{background:var(--color-background-danger);color:var(--color-text-danger);}
.t-cat{background:var(--color-background-info);color:var(--color-text-info);}
.stars{color:#f59e0b;letter-spacing:-1px;}
.hidden{display:none;}
.summary{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 16px;font-size:12px;color:var(--color-text-secondary);}
.summary strong{color:var(--color-text-primary);}
</style>

<div class="wrap">

<div class="summary">
Showing <strong id="count">50</strong> tools. Filter by category. <strong>Green = banao pehle</strong>, Yellow = medium priority, Red = baad mein.
</div>

<div class="filter-row">
  <button class="fb on" onclick="filter('all',this)">All (50)</button>
  <button class="fb" onclick="filter('banking',this)">🏦 Banking</button>

  <button class="fb" onclick="filter('toll',this)">🛣️ Toll/FASTag</button>
  <button class="fb" onclick="filter('tax',this)">📊 Tax/GST</button>
  <button class="fb" onclick="filter('car',this)">🚘 Car</button>
  <button class="fb" onclick="filter('general',this)">⚡ General</button>
</div>

<div class="table-wrap">

</thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

const catColors = {toll:'teal',banking:'blue',transport:'purple',tax:'amber',car:'green',general:'muted'};
const catEmoji = {toll:'🛣️',banking:'🏦',transport:'🚗',tax:'📊',car:'🚘',general:'⚡'};

let currentFilter = 'all';

function render(filter){
  const tbody = document.getElementById('tbody');
  const filtered = filter==='all' ? tools : tools.filter(t=>t.c===filter);
  document.getElementById('count').textContent = filtered.length;
  tbody.innerHTML = filtered.map((t,i)=>{
    const trClass = t.tr>=5?'t-high':t.tr>=3?'t-med':'t-low';
    const trLabel = t.tr>=5?'Very High':t.tr>=4?'High':t.tr>=3?'Medium':'Low';
    const stars = '★'.repeat(t.stars)+'☆'.repeat(5-t.stars);
    return `<tr>
      <td style="color:var(--color-text-tertiary);font-size:11px;">${i+1}</td>
      <td class="name">${t.n}${t.bt==='Done ✓'?'<br><span class="tag t-high">DONE ✓</span>':''}</td>
      <td>${t.p}</td>
      <td><span class="tag t-cat">${catEmoji[t.c]} ${t.c.charAt(0).toUpperCase()+t.c.slice(1)}</span></td>
      <td><span class="tag ${trClass}">${trLabel}</span><br><span class="stars" style="font-size:11px;">${stars}</span></td>
      <td style="font-size:11px;color:var(--color-text-tertiary);">${t.bt}</td>
      <td style="font-size:11px;">${t.rev}</td>
    </tr>`;
  }).join('');
}

function filter(cat, btn){
  currentFilter = cat;
  document.querySelectorAll('.fb').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render(cat);
}

render('all');
</script>
