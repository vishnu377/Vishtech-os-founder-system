function toggle(head){
  const body = head.nextElementSibling;
  const arrow = head.querySelector('.tc-arrow');
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.tc-body').forEach(b=>b.classList.remove('open'));
  document.querySelectorAll('.tc-arrow').forEach(a=>a.classList.remove('open'));
  if(!isOpen){body.classList.add('open');arrow.classList.add('open');}
}
